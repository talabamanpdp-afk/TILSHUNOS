<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#7869f5" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('tilshunos_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = saved ? (saved === 'dark') : prefersDark;
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#151522';
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.backgroundColor = '#f6f7fb';
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TILŞUNOS" />
    
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/brand_logo.png" type="image/png" />
    <link rel="shortcut icon" href="/brand_logo.png" type="image/png" />
    <link rel="apple-touch-icon" href="/brand_logo.png" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <meta name="description" content="TILŞUNOS — Ilğor til örganiş platformasi, interaktiv söz öyinlari va şaxsiy AI repetitor." />
    <title>TILŞUNOS — Til örganiş platformasi</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
